name: Daily trend report

on:
  schedule:
    - cron: "0 12 * * *"        # 12:00 UTC every day
  workflow_dispatch:
    inputs:
      subject:
        description: "Optional subject to analyse instead of auto-discovery"
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          SUBJECT: ${{ github.event.inputs.subject }}
        run: |
          if [ -n "$SUBJECT" ]; then python run.py --subject "$SUBJECT"; else python run.py; fi
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daily report $(date -u +%F)"
          git push
