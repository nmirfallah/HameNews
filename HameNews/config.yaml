# Anything you leave out falls back to the defaults in trendwatch/config.py.

llm:
  provider: anthropic            # anthropic | openai_compat (add more in trendwatch/llm/__init__.py)
  models:
    fast: claude-haiku-5-5       # high-volume labelling (cheap)
    smart: claude-sonnet-5-5     # clustering, framings, report writing
  options: {}
  # To use another model, e.g. a local one via Ollama:
  # provider: openai_compat
  # models: {fast: llama3.1, smart: llama3.1}
  # options: {base_url: "http://localhost:11434/v1"}

discovery:
  enabled_sources: [google_trends, wikipedia, hackernews, mastodon, bluesky, news_headlines]
  topics_per_day: 3
  min_platforms: 2               # a topic must trend on this many different platforms
  google_trends_geo: US

collection:
  sources: [news, bluesky, mastodon, hackernews]
  max_articles: 80
  max_posts: 80
  # Each edition shows Google News as seen from that country, giving different outlets.
  # Some combinations may return nothing; remove any that do.
  google_news_editions: [US, GB, IL, IN, AU]

narratives:                      # the "According to X, ... According to Y, ..." section
  enabled: true
  min_group_items: 2             # a source group needs this many items to get a narrative
  max_items_per_group: 8

analysis:
  min_items_outlet: 10           # articles on a topic before an outlet gets a label
  min_items_account: 15          # posts on a topic before an account gets a label
  min_kappa: 0.5                 # below this the two labelling passes disagree too much

# news_feeds: replacing this list replaces the built-in one, so include every feed you want.
# "group" is optional; without it the AI assigns the outlet to a country group
# (saved in data/outlet_groups.json, which you can edit). Find each outlet's real RSS URL
# on its own website; broken feeds are skipped with a warning.
# news_feeds:
#   - {name: "BBC News", url: "http://feeds.bbci.co.uk/news/world/rss.xml"}
#   - {name: "Some Outlet", url: "https://example.com/rss", group: "Iranian media"}
